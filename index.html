<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Волна FM Плеер</title>
  <style>
    body {
      margin: 0;
      background: #1e1e2f;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h2 {
      margin-bottom: 10px;
      color: #4ecdc4;
    }
    .radio-player {
      max-width: 320px;
      margin: 20px 0;
      padding: 20px;
      background: linear-gradient(135deg, #2c2c3a, #3a3a4f);
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      text-align: center;
    }
    audio {
      width: 100%;
      outline: none;
      border-radius: 8px;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="radio-player">
    <h2>Волна FM Россия</h2>
    <audio controls preload="none">
      <source src="https://api.codetabs.com/v1/proxy/?quest=http://radio.volnafm.ru:8000/rus" type="audio/mpeg">
      Ваш браузер не поддерживает аудиоэлемент.
    </audio>
  </div>

  <div class="radio-player">
    <h2>Волна FM DEEP</h2>
    <audio controls preload="none">
      <source src="https://api.codetabs.com/v1/proxy/?quest=http://radio.volnafm.ru:8000/deep" type="audio/mpeg">
      Ваш браузер не поддерживает аудиоэлемент.
    </audio>
  </div>

  <div class="radio-player">
    <h2>Волна FM Екатеринбург</h2>
    <audio controls preload="none">
      <source src="https://api.codetabs.com/v1/proxy/?quest=http://radio.volnafm.ru:8000/ekb" type="audio/mpeg">
      Ваш браузер не поддерживает аудиоэлемент.
    </audio>
  </div>

  <script>
    const players = document.querySelectorAll('audio');
    players.forEach(player => {
      player.addEventListener('play', () => {
        players.forEach(p => {
          if (p !== player) p.pause();
        });
      });
    });
  </script>
</body>
</html>
