<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Волна FM Плеер</title>
  <style>
    body {
      margin: 0;
      background: #1e1e2f;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      color: #4ecdc4;
      margin-bottom: 30px;
    }

    .players-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }

    .radio-player {
      flex: 1 1 300px;
      max-width: 320px;
      background: linear-gradient(135deg, #2c2c3a, #3a3a4f);
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .radio-player:hover {
      transform: scale(1.03);
    }

    .radio-player h2 {
      margin-bottom: 12px;
      color: #4ecdc4;
    }

    audio {
      width: 100%;
      outline: none;
      border-radius: 8px;
      background: #000;
    }

    @media (max-width: 768px) {
      .players-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <h1>Радио Волна FM</h1>
  <div class="players-container">
    <div class="radio-player">
      <h2>Волна FM Россия</h2>
      <audio controls preload="none">
        <source src="https://api.codetabs.com/v1/proxy/?quest=http://radio.volnafm.ru:8000/rus" type="audio/mpeg">

      </audio>
    </div>

        Ваш браузер не поддерживает аудиоэлемент.
      </audio>
    </div>
