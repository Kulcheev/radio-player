<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Волна FM Плеер</title>
  <style>
    body {
      margin: 0;
      background: #f59a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      color: #fff;
      margin-bottom: 30px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }

    .players-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }

    .radio-player {
      flex: 1 1 300px;
      max-width: 320px;
      background: #fff8f1;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      color: #3a2b1f;
    }

    .radio-player:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 25px rgba(0,0,0,0.3);
    }

    .radio-player h2 {
      margin-bottom: 12px;
      color: #b55e00;
      font-size: 20px;
    }

    audio {
      width: 100%;
      outline: none;
      border-radius: 8px;
      background-color: #fff0dd;
    }

    @media (max-width: 768px) {
      .players-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <h1>Радио Волна FM</h1>
  <div class="players-container">
    <div class="radio-player">
      <h2>Волна FM Россия</h2>
      <audio controls preload="none">
        <source src="https://api.codetabs.com/v1/proxy/?quest=http://radio.volnafm.ru:8000/rus" type="audio/mpeg">
        Ваш браузер не поддерживает аудиоэлемент.
      </audio>
    </div>

    <div class="radio-player">
      <h2>Волна FM DEEP</h2>
      <audio controls preload="none">
        <source src="https://api.codetabs.com/v1/proxy/?quest=http://radio.volnafm.ru:8000/deep" type="audio/mpeg">
        Ваш браузер не поддерживает аудиоэлемент.
      </audio>
    </div>

    <div class="radio-player">
      <h2>Волна FM Екатеринбург</h2>
      <audio controls preload="none">
        <source src="https://api.codetabs.com/v1/proxy/?quest=http://radio.volnafm.ru:8000/ekb" type="audio/mpeg">
        Ваш браузер не поддерживает аудиоэлемент.
      </audio>
    </div>
  </div>

  <script>
    const players = document.querySelectorAll('audio');
    players.forEach(player => {
      player.addEventListener('play', () => {
        players.forEach(p => {
          if (p !== player) p.pause();
        });
      });
    });
  </script>
</body>
</html>
